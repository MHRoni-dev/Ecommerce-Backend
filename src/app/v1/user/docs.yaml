paths:
  /user/register:
    post: 
      tags:
        - User 
      summary: create a new User 
      description: This endpoint is used to create a new User in the system. 
      requestBody:
        description: User data to create 
        required: true 
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
            examples:
              example01:
                $ref: '#/components/examples/UserJohnDoeExample'
              example02:
                $ref: '#/components/examples/UserTestExample'
      responses:
        '201':
          description: User created successfully
          content: 
            application/json:
              schema:
                type: object 
                properties:
                  status: 
                    type: string  
                  message:
                    type: string 
                  user: 
                    $ref: '#/components/schemas/UserResponse' 

        '400':
          description: Validation Error or Invalid Input
          content: 
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ZodValidationError'
                  - $ref: '#/components/schemas/HttpError'

        '500':
          description: Server Error
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ServerError'

  /user/login:
    post: 
      tags:
        - User 
      summary: login a User 
      description: This endpoint is used to login a User in the system. 
      requestBody:
        description: User data to login 
        required: true 
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
            examples:
              example01:
                $ref: '#/components/examples/UserJohnDoeExample'
              example02:
                $ref: '#/components/examples/UserTestExample'
      responses:
        '200':
          description: User log in successfully
          content: 
            application/json:
              schema:
                type: object 
                properties:
                  status: 
                    type: string  
                  message:
                    type: string 
                  user: 
                    $ref: '#/components/schemas/UserResponse'
                  accessToken: 
                    type: string 

        '400':
          description: Validation Error or Invalid Input
          content: 
             application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ZodValidationError'
                  - $ref: '#/components/schemas/HttpError'
        '403':
          description: User is not verified
          content:
            application/json:
              example:
                  status: fail
                  message: User is not verified
        '500':
          description: Server Error
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ServerError'
  /user/resend-verification:
    post: 
      tags:
        - User 
      summary: resend verification email 
      description: This endpoint is used to resend verification email. 
      requestBody:
        description: User data to resend verification email 
        required: true 
        content:
          application/json:
            schema:
              type: object
              properties:
                email: 
                  type: string 
                  format: email
                  default: john@doe.com
                  required: true
                purpose:
                  type: string
                  default: emailVerification
                  enum: [emailVerification, passwordReset]
                  required: false
            examples:
              example01:
                summary: Send verification for email verification
                value:
                  email: john@doe.com
                  purpose: emailVerification
              example02:
                summary: Send verification for password reset
                value:
                  email: john@doe.com
                  purpose: passwordReset
      responses:
        '200':
          description: Verification email sent successfully
          content: 
            application/json:
              example:
                status: success
                message: Verification email sent successfully

        '400':
          description: Validation Error or Invalid Input
          content:
            application/json:
              examples:
                example01:
                  summary: Invalid email
                  value:
                    status: fail
                    message: Invalid email
                example02:
                  summary: Register your account first
                  value:
                    status: fail
                    message: Register your account first

        '500':
          description: Server Error
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ServerError'
  /user/verify/{email}:
    get:
      tags:
        - User 
      summary: verify user 
      description: This endpoint is used to verify user. Either with token or otp. 
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            format: email
            default: john@doe.com
          description: User email
        - in: query
          name: token
          description: User verification token 
          required: false
          schema:
            type: string
        - in: query
          name: otp
          description: User verification otp 
          required: false
          schema:
            type: string

      responses:
        '200':
          description: User verified successfully
          content: 
            application/json:
              example:
                status: success
                message: User verified successfully

        '400':
          description: Validation Error or Invalid Input
          content:
            application/json:
              examples:
                example01:
                  summary: Invalid email
                  value:
                    status: fail
                    message: Invalid email
                example02:
                  summary: Register your account first
                  value:
                    status: fail
                    message: Register your account first
                example03:
                  summary: Invalid otp or token
                  value:
                    status: fail
                    message: Invalid otp or token  
                

        '403':
          description: User already verified
          content:
            application/json:
              example:
                  status: fail
                  message: User already verified
        '500':
          description: Server Error
          content:  
            application/json:
              schema: 
                $ref: '#/components/schemas/ServerError' 

  /user/reset-password:
    put:
      tags:
        - User 
      summary: reset user password 
      description: you need to be verified user to reset password, and request verification from resend-verification endpoint first
      requestBody:
        description: User data to reset password 
        required: true 
        content:
          application/json:
            schema:
              type: object
              properties:
                email: 
                  type: string 
                  format: email
                  default: john@doe.com
                  required: true
                password:
                  type: string
                  format: password
                  default: XXXXXXXX
                  required: true
                otp:
                  type: string
                  required: false
                  default: 123456
                token: 
                  type: string
                  required: false
            examples:
              example01:
                summary: request reset password with otp
                value:
                  email: johndoe@doe.com
                  password: password
                  otp: 123456
              example02:
                summary: request reset password with token
                value:
                  email: johndoe@doe.com
                  password: password
                  token: token
      responses:
        '200':
          description: User password reset successfully
          content:
            application/json:
              example:
                status: success
                message: User password reset successfully

        '400':
          description: Validation Error or Invalid Input
          content:
            application/json:
              examples:
                example01:
                  summary: Invalid email
                  value:
                    status: fail
                    message: Invalid email
                example02: 
                  summary: Password required
                  value:
                    status: fail
                    message: Password is required
                example03:
                  summary: Register your account first
                  value:
                    status: fail
                    message: Register your account first
                example04:
                  summary: Invalid otp or token
                  value:
                    status: fail
                    message: Invalid otp or token
        '403':
          description: Otp or token is already used 
          content:
            application/json:
              example:
                  status: fail
                  message: Otp or token is already used

        '500':
          description: Server Error
          content:  
            application/json:
              schema: 
                $ref: '#/components/schemas/ServerError'

  /user/update-profile-image:
    post:
      tags:
        - User
      summary: update user profile 
      description: you need to be verified user to update profile
      requestBody:
        description: User data to update profile 
        required: true 
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                profileImage: 
                  type: string 
                  format: binary
                  required: true
                

      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              example:
                status: success
                message: User profile updated successfully
                data: 
                  profileImage: profile image url
                  publicId: profile image public id

        '400':
          description: Image not provided or invalid image
          content:
            application/json:
              example:
                  status: fail
                  message: profile image is required
        '401':
          description: User not logged in
          content:
            application/json:
              example:
                  status: fail
                  message: Please login first
        '500':
          description: Server Error
          content:  
            application/json:
              schema: 
                $ref: '#/components/schemas/ServerError'

  /user/update-profile-data:
    put:
      tags:
        - User
      summary: update user profile 
      description: you need to be verified user to update profile
      requestBody:
        description: User data to update profile 
        required: true 
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  required: false
                phone:
                  type: string
                  required: false
                gender:
                  type: string
                  oneOf:
                    - male
                    - female
                    - other
                  required: false
                dateOfBirth:
                  type: string
                  format: date
                  required: false
            examples:
              example01:
                summary: update name
                value:
                  name: john
              example02:
                summary: update phone
                value:
                  phone: '1234567890'
              example03:
                summary: update gender
                value:
                  gender: male
              example04:
                summary: update date of birth
                value:
                  dateOfBirth: 2000-01-01

      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              example:
                status: success
                message: User profile updated successfully
                data: 
                  $ref: '#/components/examples/UserExample'

        '400': 
          description: Validation Error or Invalid Input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZodValidationError'

        '401':
          description: User not logged in
          content:
            application/json:
              example:
                  status: fail
                  message: Please login first
        '500':
          description: Server Error
          content:  
            application/json:
              schema: 
                $ref: '#/components/schemas/ServerError'
  
  /user/update-password:
    put:
      tags:
        - User
      summary: update user password
      description: you need to be verified user to update password
      requestBody:
        description: User data to update password 
        required: true 
        content:
          application/json:
            schema:
              type: object
              properties:
                oldpassword:
                  type: string
                  required: true
                newPassword:
                  type: string
                  required: true
            examples:
              example01:
                summary: set password to XXXXXXXXX
                value:
                  oldPassword: password here
                  newPassword: XXXXXXXXX
              example02:
                summary: set password to 12345678
                value:
                  oldPassword: password here
                  newPassword: '12345678'

      responses:
        '200':
          description: User password updated successfully
          content:
            application/json:
              example:
                status: success
                message: Password updated successfully

        '400':  
          description: Validation Error or Invalid Input
          content:
            application/json:
              example:
                status: fail
                message: oldPassword and newPassword is required

        '401':
          description: User not logged in
          content:
            application/json:
              example:
                  status: fail
                  message: Please login first
        '500':
          description: Server Error
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/ServerError'


components:
  schemas:
  # User Input Schemas
    UserCreateInput: 
      type: object 
      required: 
        - email 
        - password 
      properties:
        email:
          type: string 
          format: email
          default: john@doe.com
        password:
          type: string
          format: password
          default: XXXXXXXX
        
  # User Response Schemas
    UserResponse:
      type: object 
      properties:
        _id:
          type: string
          format: uuid 
        email:
          type: string
          format: email 
        name:
          type: string
        phone:
          type: string
          format: phone
        gender:
          type: string
          oneOf:
            - male
            - female
            - other
        dateOfBirth:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string 
          format: date-time



  # Error Schemas
    ZodValidationError:
      type: object 
      properties:
        status:
          type: string 
          default: fail
        message: 
          type: string
          default: Validation Error
        errors: 
          type: array
          items:
            type: string
            default: error messages
    HttpError:
      type: object
      properties:
        status: 
          type: string
          default: fail
        message: 
          type: string
          example: error message
    ServerError:
      type: object 
      properties:
        status: 
          type: string
          default: fail 
        message: 
          type: string 
          default: something went wrong!
  
  examples:
  # User Create Example
    UserJohnDoeExample:
      summary: sample john doe User 
      value:
        email: johndoe@doe.com
        password: password 
    UserTestExample:
      summary: sample test User 
      value:
        email: test@mail.com
        password: password 
    UserExample: 
      summary: User Example 
      value: 
          _id: "67187b802898a8832b15acfa"
          email: "johndoe@doe.com"
          name: "john doe"
          phone: "1234567890"
          gender: "male"
          dateOfBirth: "2000-01-01"
          createdAt: "2024-10-23T04:28:48.548Z"
          updatedAt: "2024-10-23T04:28:48.548Z"


  responses:
    UserNotFound:
            description: Not found
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status: 
                      type: string 
                      default: fail 
                    message: 
                      type: string
                      default: 
                          'User not found'
                    user: 
                      $ref: '#/components/schemas/UserResponse'
    InternalServerError:
      description: Server Error
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/ServerError'
